name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          SSH_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -e
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$AWS_HOST" > "$HOME/.ssh/known_hosts"

          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.env \
            -czf /tmp/backend.tar.gz .
          umask 077
          printf '%s\n' "$PRODUCTION_ENV" > /tmp/backend.env

          scp -i "$HOME/.ssh/deploy_key" /tmp/backend.tar.gz /tmp/backend.env \
            "ubuntu@$AWS_HOST:/tmp/"

          ssh -i "$HOME/.ssh/deploy_key" "ubuntu@$AWS_HOST" '
            set -e
            trap "rm -f /tmp/backend.tar.gz /tmp/backend.env" EXIT
            mkdir -p /home/ubuntu/liqwifi-backend
            tar -xzf /tmp/backend.tar.gz -C /home/ubuntu/liqwifi-backend
            install -m 600 /tmp/backend.env /home/ubuntu/liqwifi-backend/.env
            cd /home/ubuntu/liqwifi-backend
            docker compose -f docker-compose.production.yml build
            docker compose -f docker-compose.production.yml up -d redis
            docker compose -f docker-compose.production.yml run --rm backend npm run migration:run:prod
            docker compose -f docker-compose.production.yml up -d --remove-orphans
          '
